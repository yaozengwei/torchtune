# Config for multi-device full finetuning in full_finetune_distributed.py
# using a gemma2 9B model
#
# This config assumes that you've run the following command before launching
# this run:
#   tune download google/gemma-2-9b --ignore-patterns "gemma-2-9b.gguf"  --hf-token <HF_TOKEN>
#
# To launch on 4 devices, run the following command from root:
#   tune run --nnodes 1 --nproc_per_node 4 full_finetune_distributed --config gemma2/9B_full
#
# You can add specific overrides through the command line. For example
# to override the checkpointer directory while launching training
# you can run:
#   tune run --nnodes 1 --nproc_per_node 4 full_finetune_distributed --config gemma2/9B_full checkpointer.checkpoint_dir=<YOUR_CHECKPOINT_DIR>
#
# This config works only when the model is being fine-tuned on 2+ GPUs.

output_dir: output/gemma2_9B/finetune_kv
hf_model_path: hf_download/model/gemma2_9B
hf_ds_path: hf_download/dataset/smoltalk

# Tokenizer
tokenizer:
  _component_: torchtune.models.gemma.gemma_tokenizer
  path: ${hf_model_path}/tokenizer.model

# Dataset
dataset:
  _component_: torchtune.datasets.chat_dataset
  source: ${hf_ds_path}
  conversation_column: messages
  conversation_style: openai
  name: all
  packed: True  # True increases speed
  train_on_input: False  # Mask out prompt when computing loss
seed: null
shuffle: True

# Model Arguments
model:
  _component_: torchtune.models.gemma2.gemma2_9b

finetune_modules: ['k_proj', 'v_proj']

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${hf_model_path}
  checkpoint_files:
    filename_format: model-{}-of-{}.safetensors
    max_filename: "00008"
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: GEMMA2
resume_from_checkpoint: False

# Fine-tuning arguments
batch_size: 16
epochs: 2
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  lr: 2e-5
loss:
  _component_: torchtune.modules.loss.CEWithChunkedOutputLoss
max_steps_per_epoch: null
gradient_accumulation_steps: 1  # Use to increase effective batch size
clip_grad_norm: null
compile: False  # torch.compile the model + loss, True increases speed + decreases memory
optimizer_in_bwd: False  # True saves memory. Requires gradient_accumulation_steps=1

# Training env
device: cuda

# Memory management
enable_activation_checkpointing: True  # True reduces memory
enable_activation_offloading: False  # True reduces memory

# Reduced precision
dtype: bf16

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/tensorboard
log_every_n_steps: 5
log_peak_memory_stats: True

# Profiler (disabled)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False

  #Output directory of trace artifacts
  output_dir: ${output_dir}/profiling_outputs

  #`torch.profiler.ProfilerActivity` types to trace
  cpu: True
  cuda: True

  #trace options passed to `torch.profiler.profile`
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False

  # `torch.profiler.schedule` options:
  # wait_steps -> wait, warmup_steps -> warmup, active_steps -> active, num_cycles -> repeat
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
